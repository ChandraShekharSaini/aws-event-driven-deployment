name: Deploy Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Website to S3
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check GitHub OIDC configuration
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "AWS_ROLE_ARN configured: ${{ vars.AWS_ROLE_ARN != '' }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Upload index.html
        run: |
          aws s3 cp website/index.html \
            s3://my-nginx-website-890123/index.html \
            --content-type text/html

      - name: Deployment Started
        run: |
          echo "index.html uploaded to S3"
          echo "S3 ObjectCreated event should trigger Lambda"
