
name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-aws:
    name: Test GitHub to AWS Authentication
    runs-on: ubuntu-latest

    steps:

      - name: Check GitHub Information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::032068930648:role/s3-lambda-nginx-github-role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "AWS authentication successful!"
          aws sts get-caller-identity

      - name: Check S3 Access
        run: |
          aws s3 ls s3://my-nginx-website-890123

      - name: Test Upload
        run: |
          echo "<h1>GitHub Actions OIDC Test</h1>" > test.html

          aws s3 cp test.html \
            s3://my-nginx-website-890123/test.html \
            --content-type text/html

          echo "S3 upload successful!"

