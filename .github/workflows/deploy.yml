
name: Test AWS Access Keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aws:
    name: Test GitHub to AWS Authentication
    runs-on: ubuntu-latest

    steps:

      - name: Check GitHub Information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: |
          echo "AWS authentication successful!"
          aws sts get-caller-identity

      - name: Check S3 Access
        run: |
          aws s3 ls s3://my-nginx-website-890123

      - name: Test Upload
        run: |
          echo "<h1>GitHub Actions Access Key Test</h1>" > test.html

          aws s3 cp test.html \
            s3://my-nginx-website-890123/test.html \
            --content-type text/html

          echo "S3 upload successful!"

